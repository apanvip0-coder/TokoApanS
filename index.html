<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APAN STR JUAL BELI GAME</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top left,#252525 0,#101010 35%,#050505 75%);
  color:white;
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(10,10,10,.82);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:.5px;
}

.logo span{
  display:block;
  font-size:10px;
  opacity:.55;
  letter-spacing:2px;
  margin-top:3px;
}

.dev-btn{
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  color:white;
  padding:9px 13px;
  border-radius:12px;
}

.container{
  width:calc(100% - 28px);
  max-width:1150px;
  margin:auto;
}

.hero{
  margin-top:22px;
  padding:28px 22px;
  border-radius:25px;
  background:
    linear-gradient(135deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.hero small{
  opacity:.55;
  text-transform:uppercase;
  letter-spacing:2px;
}

.hero h1{
  margin-top:8px;
  font-size:clamp(28px,7vw,52px);
  line-height:1;
}

.hero p{
  margin-top:12px;
  color:#aaa;
}

.search{
  margin-top:18px;
}

.search input{
  width:100%;
  padding:15px 17px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.12);
  background:#111;
  color:white;
  outline:none;
}

.search input:focus{
  border-color:#777;
}

.section{
  margin-top:28px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.section-title h2{
  font-size:20px;
}

.games{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.game{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:white;
  padding:14px 8px;
  border-radius:16px;
  text-align:center;
}

.game:hover{
  background:rgba(255,255,255,.1);
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:3px;
}

.tab{
  white-space:nowrap;
  border:1px solid rgba(255,255,255,.1);
  background:#111;
  color:#aaa;
  padding:9px 14px;
  border-radius:999px;
}

.tab.active{
  background:white;
  color:black;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card{
  overflow:hidden;
  border-radius:19px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 12px 35px rgba(0,0,0,.2);
}

.product-image{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#151515;
  overflow:hidden;
  cursor:pointer;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.25s;
}

.product-image:hover img{
  transform:scale(1.04);
}

.status{
  position:absolute;
  top:10px;
  left:10px;
  padding:6px 9px;
  border-radius:9px;
  font-size:10px;
  font-weight:bold;
  backdrop-filter:blur(10px);
}

.available{
  background:rgba(20,150,80,.9);
}

.sold{
  background:rgba(200,40,40,.9);
}

.card-body{
  padding:13px;
}

.game-name{
  font-size:11px;
  color:#888;
  margin-bottom:5px;
}

.product-name{
  font-size:16px;
  font-weight:bold;
}

.price{
  margin-top:9px;
  font-size:17px;
  font-weight:bold;
}

.buy{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:12px;
  padding:12px;
  background:white;
  color:black;
  font-weight:bold;
}

.buy:hover{
  opacity:.85;
}

.buy.sold-button{
  background:#292929;
  color:#777;
  cursor:not-allowed;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px 10px;
  color:#777;
}

footer{
  margin-top:50px;
  padding:30px 15px;
  text-align:center;
  color:#666;
  border-top:1px solid rgba(255,255,255,.06);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.86);
  backdrop-filter:blur(10px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:94vh;
  overflow:auto;
  background:#111;
  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;
  padding:18px;
}

.close{
  float:right;
  border:0;
  background:#292929;
  color:white;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
}

.full-image{
  width:100%;
  max-height:80vh;
  object-fit:contain;
  border-radius:15px;
  margin-top:10px;
}

/* DEV */

.dev-panel{
  display:none;
  margin-top:25px;
  padding:20px;
  border-radius:22px;
  background:#101010;
  border:1px solid rgba(255,255,255,.1);
}

.dev-panel.show{
  display:block;
}

.dev-panel h2{
  margin-bottom:15px;
}

.form{
  display:grid;
  gap:10px;
}

.form input,
.form select{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #292929;
  background:#181818;
  color:white;
  outline:none;
}

.form button{
  padding:13px;
  border:0;
  border-radius:12px;
  background:white;
  color:black;
  font-weight:bold;
}

.preview{
  width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:12px;
  display:none;
}

.admin-products{
  margin-top:20px;
  display:grid;
  gap:10px;
}

.admin-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  background:#171717;
  border:1px solid #252525;
  border-radius:15px;
}

.admin-item img{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:10px;
}

.admin-info{
  flex:1;
}

.admin-info b{
  display:block;
}

.admin-info small{
  color:#777;
}

.admin-actions{
  display:flex;
  gap:6px;
}

.admin-actions button{
  border:0;
  padding:8px 10px;
  border-radius:9px;
  color:white;
}

.edit-btn{
  background:#444;
}

.delete-btn{
  background:#8d2222;
}

.cancel-btn{
  background:#333!important;

}

@media(max-width:800px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .games{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(min-width:801px){
  .hero{
    padding:45px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      APAN STR
      <span>JUAL BELI GAME</span>
    </div>

    <button class="dev-btn" onclick="openDev()">
      ⚙ DEV
    </button>

  </div>
</header>


<main class="container">

  <section class="hero">

    <small>APAN STORE</small>

    <p>

    </p>

    <div class="search">
      <input
        id="search"
        type="text"
        placeholder="🔎 Cari game atau produk..."
        oninput="renderProducts()"
      >
    </div>

  </section>


  <section class="section">

      <h2>🎮 Pilih Game</h2>
    </div>

    <div class="games">

      <button class="game" onclick="selectGame('Mobile Legends')">

      <button class="game" onclick="selectGame('Free Fire')">

      <button class="game" onclick="selectGame('PUBG Mobile')">

      <button class="game" onclick="selectGame('Valorant')">

<footer>
  © 2026 APAN STR JUAL BELI GAME
</footer>


<!-- FULLSCREEN IMAGE -->

<div id="imageModal" class="modal" onclick="closeImageModal()">

  <div class="modal-box" onclick="event.stopPropagation()">

    <button class="close" onclick="closeImageModal()">

    </button>

    <img id="fullImage" class="full-image">

  </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://qgbyyutbuxklqkxwzgiz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LQpt2Sozs4lLek7pHn1q_w_QyamD2E4";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   WHATSAPP
========================================= */

/*
  GANTI ANGKA DI BAWAH DENGAN NOMOR WHATSAPP
  CONTOH:
  6281234567890

  Jangan gunakan + atau spasi.
*/

const WHATSAPP_NUMBER = "628135841685";


/* =========================================
   DATA
========================================= */

let products = [];

let currentTab = "semua";

let selectedGame = "";


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

  const { data, error } =
    await supabaseClient
      .from("product")
      .select("*")
      .order("created_at", {ascending:false});

  if(error){

    console.error(error);

    document.getElementById("products").innerHTML =
      `<div class="empty">
        Gagal memuat produk.<br>
        Periksa tabel Supabase.
      </div>`;

    return;
  }

  products = data || [];

  renderProducts();

  renderAdminProducts();
}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

  const container =
    document.getElementById("products");

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  let filtered = products.filter(p => {

    const nama =
      String(p.nama || "").toLowerCase();

    const game =
      String(p.game || "").toLowerCase();

    const kategori =
      String(p.kategori || "").toLowerCase();

    const status =
      String(p.status || "TERSEDIA").toUpperCase();


    const matchSearch =
      !search ||
      nama.includes(search) ||
      game.includes(search) ||
      kategori.includes(search);


    const matchTab =
      currentTab === "semua" ||
      status === currentTab;


    const matchGame =
      !selectedGame ||
      game === selectedGame.toLowerCase();


    return matchSearch && matchTab && matchGame;

  });


  if(filtered.length === 0){

    container.innerHTML =
      `<div class="empty">
        Belum ada produk.
      </div>`;

    return;
  }


  container.innerHTML =
    filtered.map(p => {

      const status =
        String(p.status || "TERSEDIA").toUpperCase();

      const sold =
        status === "SOLD OUT";


      const image =
        p.foto ||
        `https://placehold.co/600x600/111111/ffffff?text=${encodeURIComponent(
          p.icon || "GAME"
        )}`;


      return `

        <article class="card">

          <div
            class="product-image"
            onclick="openImage('${escapeAttribute(image)}')"
          >

            <img
              src="${escapeAttribute(image)}"
              alt="${escapeAttribute(p.nama || '')}"
              loading="lazy"
              onerror="this.src='https://placehold.co/600x600/111111/ffffff?text=APAN+STR'"
            >

            <span class="status ${sold ? "sold" : "available"}">
              ${sold ? "SOLD OUT" : "TERSEDIA"}
            </span>

          </div>


          <div class="card-body">

            <div class="game-name">
              ${escapeHtml(p.game || "")}
            </div>

            <div class="product-name">
              ${escapeHtml(p.nama || "")}
            </div>

            <div class="price">
              ${escapeHtml(p.harga || "-")}
            </div>


            ${
              sold

              ?

              `<button
                class="buy sold-button"
                disabled
              >
                SOLD OUT
              </button>`

              :

              `<button
                class="buy"
                onclick="buyProduct('${p.id}')"
              >
                🛒 BELI VIA WHATSAPP
              </button>`
            }

          </div>

        </article>

      `;

    }).join("");

}


/* =========================================
   WHATSAPP
========================================= */

function buyProduct(id){

  const product =
    products.find(p => String(p.id) === String(id));

  if(!product) return;


  if(
    !WHATSAPP_NUMBER ||
    WHATSAPP_NUMBER.includes("XXXXXXXX")
  ){

    alert(
      "Nomor WhatsApp belum diatur di index.html."
    );

    return;
  }


  const message =
`Halo admin ApanSTR 👋😉

Saya ingin order produk : 👇
==========================
Produk: ${product.nama}
Game: ${product.game}
Harga: ${product.harga}
Status: ${product.status}
==========================
apakah produk ini masih Tersedia? jika masih saya Mau order 🤗`;


  const url =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(message);


  window.open(url,"_blank");

}


/* =========================================
   IMAGE FULLSCREEN
========================================= */

function openImage(url){

  document.getElementById("fullImage").src = url;

  document
    .getElementById("imageModal")
    .classList.add("show");

}


function closeImageModal(){

  document
    .getElementById("imageModal")
    .classList.remove("show");

}


/* =========================================
   TABS
========================================= */

function setTab(tab,button){

  currentTab = tab;

  document
    .querySelectorAll(".tab")
    .forEach(x => x.classList.remove("active"));

  button.classList.add("active");

  renderProducts();

}


/* =========================================
   GAME FILTER
========================================= */

function selectGame(game){

  selectedGame =
    selectedGame === game
      ? ""
      : game;

  renderProducts();

}


/* =========================================
   DEV LOGIN
========================================= */

function openDev(){

  const password =
    prompt("Masukkan password DEV:");

  if(password !== "APAN123"){

    alert("Password salah.");

    return;
  }


  document
    .getElementById("devPanel")
    .classList.toggle("show");

}


/* =========================================
   PREVIEW IMAGE
========================================= */

function previewImage(event){

  const file =
    event.target.files[0];

  if(!file) return;


  const preview =
    document.getElementById("preview");

  preview.src =
    URL.createObjectURL(file);

  preview.style.display = "block";

}


/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(event){

  event.preventDefault();


  const editId =
    document.getElementById("editId").value;


  const nama =
    document.getElementById("nama").value.trim();

  const game =
    document.getElementById("game").value.trim();

  const harga =
    document.getElementById("harga").value.trim();

  const kategori =
    document.getElementById("kategori").value.trim();

  const icon =
    document.getElementById("icon").value.trim();

  const status =
    document.getElementById("status").value;


  const file =
    document.getElementById("foto").files[0];


  let foto = "";


  /* Jika edit, gunakan foto lama */

  if(editId){

    const old =
      products.find(
        p => String(p.id) === String(editId)
      );

    foto = old?.foto || "";

  }


  /* Upload foto baru */

  if(file){

    const extension =
      file.name.split(".").pop();

    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "." +
      extension;


    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("product")
        .upload(fileName,file);


    if(uploadError){

      console.error(uploadError);

      alert(
        "Foto gagal diupload. Periksa Storage bucket 'product'."
      );

      return;
    }


    const { data } =
      supabaseClient
        .storage
        .from("product")
        .getPublicUrl(fileName);


    foto = data.publicUrl;

  }


  const data = {

    nama,
    game,
    harga,
    kategori: kategori || null,
    icon: icon || null,
    foto: foto || null,
    status

  };


  let result;


  if(editId){

    result =
      await supabaseClient
        .from("product")
        .update(data)
        .eq("id",editId);

  }else{

    result =
      await supabaseClient
        .from("product")
        .insert([data]);

  }


  if(result.error){

    console.error(result.error);

    alert(
      "Gagal menyimpan produk:\n" +
      result.error.message
    );

    return;
  }


  alert(
    editId
      ? "Produk berhasil diperbarui!"
      : "Produk berhasil ditambahkan!"
  );


  cancelEdit();

  await loadProducts();

}


/* =========================================
   EDIT PRODUCT
========================================= */

function editProduct(id){

  const p =
    products.find(
      x => String(x.id) === String(id)
    );

  if(!p) return;


  document.getElementById("editId").value =
    p.id;

  document.getElementById("nama").value =
    p.nama || "";

  document.getElementById("game").value =
    p.game || "";

  document.getElementById("harga").value =
    p.harga || "";

  document.getElementById("kategori").value =
    p.kategori || "";

  document.getElementById("icon").value =
    p.icon || "";

  document.getElementById("status").value =
    p.status || "TERSEDIA";


  const preview =
    document.getElementById("preview");


  if(p.foto){

    preview.src = p.foto;

    preview.style.display = "block";

  }else{

    preview.style.display = "none";

  }


  document.getElementById("saveButton").innerText =
    "💾 Simpan Perubahan";


  document
    .getElementById("devPanel")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =========================================
   CANCEL EDIT
========================================= */

function cancelEdit(){

  document.querySelector(".form").reset();

  document.getElementById("editId").value = "";

  document.getElementById("preview").style.display =
    "none";

  document.getElementById("saveButton").innerText =
    "➕ Tambah Produk";

}


/* =========================================
   ADMIN PRODUCTS
========================================= */

function renderAdminProducts(){

  const container =
    document.getElementById("adminProducts");


  if(!products.length){

    container.innerHTML =
      `<div class="empty">
        Belum ada produk.
      </div>`;

    return;
  }


  container.innerHTML =
    products.map(p => {

      const image =
        p.foto ||
        "https://placehold.co/100x100/111111/ffffff?text=GAME";


      return `

        <div class="admin-item">

          <img
            src="${escapeAttribute(image)}"
          >

          <div class="admin-info">

            <b>
              ${escapeHtml(p.nama || "")}
            </b>

            <small>
              ${escapeHtml(p.game || "")}
              ·
              ${escapeHtml(p.harga || "")}
              ·
              ${escapeHtml(p.status || "TERSEDIA")}
            </small>

          </div>


          <div class="admin-actions">

            <button
              class="edit-btn"
              onclick="editProduct('${p.id}')"
            >
              ✏️
            </button>

            <button
              class="delete-btn"
              onclick="deleteProduct('${p.id}')"
            >
              🗑
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================================
   DELETE
========================================= */

async function deleteProduct(id){

  const p =
    products.find(
      x => String(x.id) === String(id)
    );


  if(!p) return;


  const yes =
    confirm(
      `Hapus produk "${p.nama}"?`
    );


  if(!yes) return;


  const { error } =
    await supabaseClient
      .from("product")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      "Gagal menghapus:\n" +
      error.message
    );

    return;
  }


  await loadProducts();

}


/* =========================================
   SECURITY HELPERS
========================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return escapeHtml(value);

}


/* =========================================
   START
========================================= */

loadProducts();


/* Auto refresh */

setInterval(
  loadProducts,
  15000
);

</script>
