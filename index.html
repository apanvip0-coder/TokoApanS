<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APAN TOP UP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080808;
  color:white;
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(10,10,10,.85);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #222;
  padding:15px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#8b5cf6;
}

.search{
  width:100%;
  margin-top:14px;
  padding:13px 16px;
  border-radius:12px;
  border:1px solid #333;
  background:#151515;
  color:white;
  outline:none;
}

.hero{
  margin:18px;
  padding:25px;
  border-radius:20px;
  background:
    radial-gradient(circle at top right,#663cff55,transparent 45%),
    linear-gradient(135deg,#171717,#0b0b0b);
  border:1px solid #292929;
}

.hero h1{
  font-size:28px;
  margin-bottom:8px;
}

.hero p{
  color:#aaa;
  font-size:14px;
}

.games{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:0 18px 15px;
}

.game{
  min-width:110px;
  padding:12px;
  border:1px solid #292929;
  border-radius:13px;
  background:#121212;
  color:white;
  cursor:pointer;
  text-align:center;
}

.game.active{
  border-color:#8b5cf6;
  background:#21133e;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 18px 18px;
}

.tab{
  white-space:nowrap;
  padding:9px 15px;
  border-radius:20px;
  border:1px solid #292929;
  background:#111;
  color:#aaa;
  cursor:pointer;
}

.tab.active{
  color:white;
  background:#8b5cf6;
  border-color:#8b5cf6;
}

.container{
  padding:0 18px 40px;
}

.title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:14px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:#121212;
  border:1px solid #292929;
  border-radius:15px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:125px;
  object-fit:cover;
  background:#1c1c1c;
}

.icon{
  height:125px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  background:linear-gradient(135deg,#191919,#252525);
}

.info{
  padding:12px;
}

.game-name{
  color:#888;
  font-size:11px;
  margin-bottom:5px;
}

.product-name{
  font-weight:bold;
  font-size:15px;
  min-height:38px;
}

.price{
  color:#a78bfa;
  font-weight:bold;
  margin:8px 0;
}

.buy{
  width:100%;
  border:0;
  padding:10px;
  border-radius:9px;
  background:#8b5cf6;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.buy:active{
  transform:scale(.97);
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:#777;
  padding:40px 10px;
}

.dev-button{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:30;
  border:0;
  border-radius:50%;
  width:52px;
  height:52px;
  background:#8b5cf6;
  color:white;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 25px #000;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:#000b;
  backdrop-filter:blur(8px);
  overflow:auto;
  padding:20px;
}

.panel{
  max-width:600px;
  margin:20px auto;
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:20px;
}

.panel h2{
  margin-bottom:15px;
}

.input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  background:#191919;
  border:1px solid #333;
  color:white;
  border-radius:10px;
  outline:none;
}

select.input{
  appearance:auto;
}

.btn{
  padding:11px 15px;
  border:0;
  border-radius:9px;
  background:#8b5cf6;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.close{
  float:right;
  background:#292929;
}

.product-admin{
  margin-top:20px;
}

.admin-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border:1px solid #292929;
  border-radius:10px;
  margin-top:8px;
}

.admin-item img{
  width:50px;
  height:50px;
  object-fit:cover;
  border-radius:8px;
}

.admin-text{
  flex:1;
  font-size:13px;
}

.delete{
  background:#d32f2f;
  color:white;
  border:0;
  padding:8px;
  border-radius:7px;
}

.hidden{
  display:none;
}

.loading{
  text-align:center;
  color:#888;
  padding:30px;
}

@media(max-width:420px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .card img,.icon{
    height:110px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">APAN<span>TOPUP</span></div>
  <input
    id="search"
    class="search"
    type="text"
    placeholder="Cari produk..."
    oninput="renderProducts()"
  >
</header>

<section class="hero">
  <h1>Top Up Game</h1>
  <p>Pilih game dan produk yang kamu inginkan.</p>
</section>

<div class="games">
  <button class="game active" onclick="selectGame('Semua',this)">🎮 Semua</button>
  <button class="game" onclick="selectGame('Mobile Legends',this)">⚔️ MLBB</button>
  <button class="game" onclick="selectGame('Free Fire',this)">🔥 Free Fire</button>
  <button class="game" onclick="selectGame('PUBG Mobile',this)">🔫 PUBG</button>
  <button class="game" onclick="selectGame('Valorant',this)">🎯 Valorant</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="selectTab('Semua',this)">Semua</button>
  <button class="tab" onclick="selectTab('Terpopuler',this)">Terpopuler</button>
  <button class="tab" onclick="selectTab('Terbaru',this)">Terbaru</button>
</div>

<main class="container">
  <div class="title">Produk</div>
  <div id="products" class="products">
    <div class="loading">Memuat produk...</div>
  </div>
</main>

<button class="dev-button" onclick="openDev()">DEV</button>

<div id="devOverlay" class="overlay">
  <div class="panel">

    <button class="btn close" onclick="closeDev()">✕</button>

    <div id="loginBox">
      <h2>DEV LOGIN</h2>

      <input
        id="devPassword"
        class="input"
        type="password"
        placeholder="Password DEV"
      >

      <button class="btn" onclick="loginDev()">Masuk</button>
    </div>

    <div id="adminBox" class="hidden">

      <h2>OWNER PANEL</h2>

      <input
        id="nama"
        class="input"
        placeholder="Nama produk"
      >

      <select id="game" class="input">
        <option value="Mobile Legends">Mobile Legends</option>
        <option value="Free Fire">Free Fire</option>
        <option value="PUBG Mobile">PUBG Mobile</option>
        <option value="Valorant">Valorant</option>
      </select>

      <input
        id="harga"
        class="input"
        placeholder="Harga, contoh: Rp10.000"
      >

      <select id="kategori" class="input">
        <option value="Terpopuler">Terpopuler</option>
        <option value="Terbaru">Terbaru</option>
      </select>

      <input
        id="icon"
        class="input"
        placeholder="Emoji/icon (opsional), contoh: 💎"
      >

      <input
        id="foto"
        class="input"
        type="file"
        accept="image/*"
      >

      <button class="btn" onclick="addProduct()">
        + Tambah Produk
      </button>

      <div class="product-admin">
        <h3>Daftar Produk</h3>
        <div id="adminProducts"></div>
      </div>

    </div>
  </div>
</div>

<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://qgbyyutbuxklqkxwzgiz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LQpt2Sozs4lLek7pHn1q_w_QyamD2E4";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   DATA
========================= */

let products = [];
let selectedGame = "Semua";
let selectedTab = "Semua";
let devLoggedIn = false;


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const container =
    document.getElementById("products");

  container.innerHTML =
    '<div class="loading">Memuat produk...</div>';

  const { data, error } =
    await supabaseClient
      .from("product")
      .select("*")
      .order("created_at", {
        ascending:false
      });

  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        Gagal memuat produk.<br><br>
        <small>${escapeHtml(error.message)}</small>
      </div>
    `;

    return;
  }

  products = data || [];

  renderProducts();

  if(devLoggedIn){
    renderAdminProducts();
  }
}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

  const container =
    document.getElementById("products");

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  let filtered = [...products];

  if(selectedGame !== "Semua"){
    filtered =
      filtered.filter(
        p => p.game === selectedGame
      );
  }

  if(selectedTab !== "Semua"){
    filtered =
      filtered.filter(
        p => p.kategori === selectedTab
      );
  }

  if(search){
    filtered =
      filtered.filter(p =>
        String(p.nama || "")
          .toLowerCase()
          .includes(search)
        ||
        String(p.game || "")
          .toLowerCase()
          .includes(search)
      );
  }

  if(filtered.length === 0){

    container.innerHTML = `
      <div class="empty">
        Belum ada produk.
      </div>
    `;

    return;
  }

  container.innerHTML =
    filtered.map(p => {

      let media = "";

      if(p.foto){

        media = `
          <img
            src="${escapeAttribute(p.foto)}"
            alt="${escapeAttribute(p.nama || "Produk")}"
            loading="lazy"
          >
        `;

      }else{

        media = `
          <div class="icon">
            ${escapeHtml(p.icon || "🎮")}
          </div>
        `;
      }

      return `
        <div class="card">

          ${media}

          <div class="info">

            <div class="game-name">
              ${escapeHtml(p.game || "")}
            </div>

            <div class="product-name">
              ${escapeHtml(p.nama || "")}
            </div>

            <div class="price">
              ${escapeHtml(p.harga || "")}
            </div>

            <button
              class="buy"
              onclick="beliProduk(${Number(p.id)})"
            >
              Beli
            </button>

          </div>

        </div>
      `;

    }).join("");
}


/* =========================
   FILTER
========================= */

function selectGame(game, button){

  selectedGame = game;

  document
    .querySelectorAll(".game")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  renderProducts();
}


function selectTab(tab, button){

  selectedTab = tab;

  document
    .querySelectorAll(".tab")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  renderProducts();
}


/* =========================
   BUY
========================= */

function beliProduk(id){

  const product =
    products.find(
      p => Number(p.id) === Number(id)
    );

  if(!product) return;

  alert(
    "Produk: " +
    product.nama +
    "\nHarga: " +
    product.harga +
    "\n\nSilakan lanjutkan pembayaran sesuai sistem toko."
  );
}


/* =========================
   DEV
========================= */

function openDev(){

  document
    .getElementById("devOverlay")
    .style.display = "block";
}


function closeDev(){

  document
    .getElementById("devOverlay")
    .style.display = "none";
}


function loginDev(){

  const password =
    document
      .getElementById("devPassword")
      .value;

  if(password === "APAN123"){

    devLoggedIn = true;

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminBox")
      .classList.remove("hidden");

    renderAdminProducts();

  }else{

    alert("Password salah.");

  }
}


/* =========================
   ADD PRODUCT
========================= */

async function addProduct(){

  if(!devLoggedIn){
    alert("Silakan login DEV.");
    return;
  }

  const nama =
    document.getElementById("nama").value.trim();

  const game =
    document.getElementById("game").value;

  const harga =
    document.getElementById("harga").value.trim();

  const kategori =
    document.getElementById("kategori").value;

  const icon =
    document.getElementById("icon").value.trim();

  const file =
    document.getElementById("foto").files[0];

  if(!nama || !harga){

    alert("Nama produk dan harga wajib diisi.");
    return;
  }

  let fotoUrl = null;

  /* Upload foto ke bucket PRODUCT */

  if(file){

    const extension =
      file.name.split(".").pop();

    const fileName =
      "produk/" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "." +
      extension;

    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("product")
        .upload(
          fileName,
          file,
          {
            upsert:false,
            contentType:file.type
          }
        );

    if(uploadError){

      console.error(uploadError);

      alert(
        "Foto gagal diupload:\n" +
        uploadError.message
      );

      return;
    }

    const { data:urlData } =
      supabaseClient
        .storage
        .from("product")
        .getPublicUrl(fileName);

    fotoUrl =
      urlData.publicUrl;
  }


  /* Insert ke tabel PRODUCT */

  const produkBaru = {
    nama:nama,
    game:game,
    harga:harga,
    kategori:kategori,
    icon:icon || null,
    foto:fotoUrl
  };


  const { error } =
    await supabaseClient
      .from("product")
      .insert([produkBaru]);


  if(error){

    console.error(error);

    alert(
      "Produk gagal ditambahkan:\n" +
      error.message
    );

    return;
  }


  alert("Produk berhasil ditambahkan.");

  document.getElementById("nama").value = "";
  document.getElementById("harga").value = "";
  document.getElementById("icon").value = "";
  document.getElementById("foto").value = "";

  await loadProducts();
}


/* =========================
   ADMIN PRODUCTS
========================= */

function renderAdminProducts(){

  const box =
    document.getElementById("adminProducts");

  if(!products.length){

    box.innerHTML =
      '<p style="color:#777;margin-top:10px">Belum ada produk.</p>';

    return;
  }

  box.innerHTML =
    products.map(p => {

      const image =
        p.foto
          ? `<img src="${escapeAttribute(p.foto)}">`
          : `<div style="
                width:50px;
                height:50px;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:25px;
                background:#222;
                border-radius:8px;
              ">${escapeHtml(p.icon || "🎮")}</div>`;

      return `
        <div class="admin-item">

          ${image}

          <div class="admin-text">
            <b>${escapeHtml(p.nama || "")}</b><br>
            <span style="color:#888">
              ${escapeHtml(p.game || "")}
            </span><br>
            <span style="color:#a78bfa">
              ${escapeHtml(p.harga || "")}
            </span>
          </div>

          <button
            class="delete"
            onclick="deleteProduct(${Number(p.id)})"
          >
            Hapus
          </button>

        </div>
      `;

    }).join("");
}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

  if(!confirm("Hapus produk ini?")){
    return;
  }

  const { error } =
    await supabaseClient
      .from("product")
      .delete()
      .eq("id", id);

  if(error){

    console.error(error);

    alert(
      "Produk gagal dihapus:\n" +
      error.message
    );

    return;
  }

  alert("Produk berhasil dihapus.");

  await loadProducts();
}


/* =========================
   SECURITY DISPLAY HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttribute(value){

  return escapeHtml(value);
}


/* =========================
   AUTO REFRESH
========================= */

loadProducts();

setInterval(
  loadProducts,
  15000
);
</script>

</body>
</html>
